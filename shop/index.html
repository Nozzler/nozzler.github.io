<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nozzler · 3D printing by Sepp</title><link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<style>
:root{--bg:#f4f3ee;--sf:#fff;--tx:#1c1b18;--mu:#6d6a62;--bd:#e3e0d8;--ac:#c2410c;--ok:#15803d;--wn:#b45309;--er:#b91c1c;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#151411;--sf:#201e1a;--tx:#f0ede6;--mu:#a09b8f;--bd:#37342d;--ac:#fb923c;--ok:#4ade80;--wn:#fbbf24;--er:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top,0)}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0 8px 0 0}h1 span{color:var(--ac)}h2{font-size:15px;margin:0 0 10px}nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{border:0;background:none;color:var(--mu);padding:7px 11px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}nav button.on{background:var(--ac);color:#fff}
main{max-width:900px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:2px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}input[type=checkbox]{width:auto}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.s{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}.mu{color:var(--mu)}.ok{color:var(--ok)}.er{color:var(--er)}.wn{color:var(--wn)}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--mu) 18%,transparent)}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:16px;text-align:center;color:var(--mu);cursor:pointer;margin-bottom:12px}.drop.h{border-color:var(--ac)}
.sw,input.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);padding:2px;cursor:pointer;font-size:12px;color:var(--tx);background:none}.sw.big{width:36px;height:36px}
.msg{padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--ac) 14%,transparent);margin-bottom:14px}
</style></head><body>
<header><h1><img src="../assets/logo.svg" alt="Nozzler" style="height:36px;display:block"></h1><nav id="nav"></nav><button class="btn g s" id="lg"></button></header>
<main><div id="msg"></div><div id="v"></div></main>
<footer style="text-align:center;padding:0 16px 24px;font-size:12px"><a href="../admin/" style="color:var(--mu)">Shop admin</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script><script src="../shared/pricing.js"></script>
<script>
const P=PRICING,C=window.APP_CONFIG||{},$=s=>document.querySelector(s),E=n=>"€"+(+n).toFixed(2),hm=m=>Math.floor(m/60)+"h "+Math.round(m%60)+"m",
esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* cookie storage: Supabase keeps the session in cookies, so customers stay logged in */
const CK={getItem(k){let s="";for(let i=0;;i++){const m=document.cookie.match(new RegExp("(?:^|; )"+k+"_"+i+"=([^;]*)"));if(!m)break;s+=m[1]}return s?decodeURIComponent(s):null},
setItem(k,v){CK.removeItem(k);const e=encodeURIComponent(v);for(let i=0;i*2500<e.length;i++)document.cookie=`${k}_${i}=${e.slice(i*2500,i*2500+2500)};path=/;max-age=31536000;SameSite=Lax${location.protocol=="https:"?";Secure":""}`},
removeItem(k){for(let i=0;i<8;i++)document.cookie=`${k}_${i}=;path=/;max-age=0`}};
const on=C.SUPABASE_URL&&!/YOUR/.test(C.SUPABASE_URL)&&window.supabase,
sb=on?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{storage:CK,storageKey:"p3d-shop",persistSession:true,autoRefreshToken:true}}):null;
const ST={new:"Received",quoted:"Quote ready",accepted:"Accepted",in_queue:"In the queue",printing:"Printing",ready:"Ready",delivered:"Delivered",declined:"Declined",cancelled:"Cancelled"},
STEPS=["new","quoted","accepted","in_queue","printing","ready","delivered"],LBL={material:"Material",machine_time:"Print time",support_removal:"Supports",color_changes:"Colour changes"};
let user=null,prof=null,wal=null,view="new",items=[],orders=[],auth={up:false,pending:""},pend=false,busy=false,
F={dm:"pickup",dl:"",due:"",tm:"",rush:false,name:"",notes:"",buy:false,design:false,desc:"",uc:false,up:false,pts:"",vc:"",vd:null};
const say=(t,bad)=>{$("#msg").innerHTML=t?`<div class="msg ${bad?"er":""}">${esc(t)}</div>`:""};
let AV=null;const PAL=P.COLORS,
pal=it=>(AV?AV.list:PAL.map(c=>({n:c[0],h:c[1],m:[]}))).filter(c=>!c.m||!c.m.length||c.m.includes(it.m)),
nearest=h=>{const n=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),a=n(h);return PAL.map(c=>[c[0],n(c[1]).reduce((s,v,i)=>s+(v-a[i])**2,0)]).sort((x,y)=>x[1]-y[1])[0][0]},
dflt=()=>({cl:[],cs:0,m:"PLA",st:"standard",lh:.2,colour:"",cols:1,qty:1,sup:"auto",sc:100,plate:0,w:"",t:""}),
site=u=>/makerworld/i.test(u)?"MakerWorld":/printables/i.test(u)?"Printables":/thingiverse/i.test(u)?"Thingiverse":"Link",
sumB=e=>e?Object.values(e.b).reduce((a,x)=>a+x,0):0,r2=v=>Math.round(v*100)/100;
function itemEst(it){const o={m:it.m,st:it.st,lh:+it.lh,cols:+it.cols||1,qty:Math.max(1,+it.qty||1),sup:it.sup,sc:+it.sc||100,rush:false};
 if(it.s&&it.s.w){o.w=it.s.w;o.t=it.s.t}else if(it.s&&it.s.vol){o.vol=it.s.vol;o.area=it.s.area}else if(+it.w>0){o.w=+it.w;o.t=+it.t||0}else return null;return P.estimate(o)}
function plates(){const g={},ord=[];items.forEach((it,i)=>{const k=+it.plate>0?"P"+it.plate:"A"+it.m+"|"+it.lh;if(!g[k]){g[k]=[];ord.push(k)}g[k].push(i)});return ord.map(k=>g[k])}
function calc(){const es=items.map(itemEst),ok=es.filter(Boolean);if(!ok.length)return null;const b={material:0,machine_time:0,support_removal:0,color_changes:0};let w=0,t=0,sp=0;
 ok.forEach(e=>{for(const k in b)b[k]+=e.b[k];w+=e.w;t+=e.t;sp+=e.sp});const sub=Object.values(b).reduce((a,x)=>a+x,0),ru=F.rush?Math.round(sub*P.rush)/100:0;
 return{w:r2(w),t,sp:r2(sp),b,rush:ru,total:r2(Math.max(P.min,sub+ru)),es,partial:ok.length<items.length}}
function domMat(){const t={};items.forEach((it,i)=>{const e=itemEst(it);t[it.m]=(t[it.m]||0)+(e?e.w:1)});return Object.keys(t).sort((a,b)=>t[b]-t[a])[0]||"PLA"}
function estHtml(){const c=calc(),x=[F.buy?"Model purchase: added after we check the price":"",F.design?"Custom design: quoted after review":""].filter(Boolean).map(t=>`<p class="mu" style="margin:6px 0 0">+ ${t}</p>`).join("");
 if(!c)return`<h2>Estimate</h2><p class="mu">${items.length?"Enter the weight (g) for link objects to see a price, or just send it and we quote it.":"Add files or links to see a price."}</p>${x}`;
 const pl=plates();return`<h2>Estimate</h2><div class="big">≈ ${E(c.total)}</div><p class="mu">${c.w} g · ${hm(c.t)} print time${c.partial?" · some objects are quoted by hand":""}. The final price is confirmed before anything is printed.</p>
 ${items.map((it,i)=>{const e=c.es[i];return`<div class="kv"><span>${esc(it.name)} ×${it.qty}</span><span>${e?E(sumB(e)):"by hand"}</span></div>`}).join("")}
 ${c.rush?`<div class="kv"><span>Rush (+${P.rush}%)</span><span>${E(c.rush)}</span></div>`:""}
 ${items.length>1?`<p class="mu" style="margin:8px 0 2px">Plates: ${pl.map((g,n)=>`#${n+1} ${[...new Set(g.map(i=>items[i].m))].join(" + ")} (${g.length} object${g.length>1?"s":""}, ${hm(g.reduce((a,i)=>a+((c.es[i]||{}).t||0),0))})`).join(" · ")}</p>`:""}${svHtml(c)}${x}`}
const loadWal=async()=>{if(!user)return;const r=await sb.from("wallets").select("*").eq("user_id",user.id).maybeSingle();wal=r.data||{points:0,credit:0}},
usePay=()=>({credit:!!F.uc,points:F.up?(F.pts===""?"all":Math.max(0,Math.floor(+F.pts||0))):0,voucher:F.vd?F.vd.serial:null,pct:F.vd?F.vd.pct:0});
/* credit first, then points (50 pts = EUR 1), then voucher % on what is left: same order as the admin quote */
function sav(t){const w=wal||{points:0,credit:0};let rem=t,cr=0,pt=0,pv=0,vd=0;
 if(user&&F.uc){cr=r2(Math.min(w.credit,rem));rem=r2(rem-cr)}
 if(user&&F.up&&rem>0){const rq=F.pts===""?w.points:Math.max(0,Math.floor(+F.pts||0));pt=Math.min(w.points,Math.floor(rem*50),rq);pv=r2(pt/50);rem=r2(Math.max(rem-pv,0))}
 if(F.vd){vd=r2(rem*F.vd.pct/100);rem=r2(rem-vd)}return{cr,pt,pv,vd,due:rem}}
function svHtml(c){const s=sav(c.total),r=(l,v)=>`<div class="kv ok"><span>${l}</span><span>−${v}</span></div>`;if(!(s.cr||s.pt||s.vd))return"";
 return`<div style="margin-top:8px">${s.cr?r("Account credit",E(s.cr)):""}${s.pt?r("Points ("+s.pt+")",E(s.pv)):""}${s.vd?r("Voucher "+F.vd.pct+"%",E(s.vd)):""}<div class="kv"><b>You pay ≈</b><b>${E(s.due)}</b></div></div>`}
const vSav=()=>!user?`<div class="card"><h2>Credit, points &amp; vouchers</h2><p class="mu" style="margin:0">Log in to use your credit and points, or a voucher code.</p></div>`:`<div class="card"><h2>Credit, points &amp; vouchers</h2>
 <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" data-f="uc" ${F.uc?"checked":""}>Use my credit (${E((wal||{}).credit||0)} available)</label>
 <div class="row" style="margin-top:8px"><label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin:0"><input type="checkbox" data-f="up" ${F.up?"checked":""}>Use my points (${(wal||{}).points||0} pts · 50 pts = €1)</label>${F.up?`<input data-f="pts" type="number" min="0" step="50" placeholder="all" value="${esc(F.pts)}" style="width:100px">`:""}</div>
 <div class="row" style="margin-top:10px"><input id="vc" placeholder="Voucher code" value="${esc(F.vc)}" style="flex:1;min-width:160px;text-transform:uppercase"><button class="btn g" id="va">Apply</button></div>${F.vd?`<p class="ok" style="margin:6px 0 0">${esc(F.vd.label||"Voucher")} · ${F.vd.pct}% off <button class="btn g s" id="vx">Remove</button></p>`:""}
 <p class="mu" style="margin:8px 0 0">Shown in your estimate; the shop confirms it in your quote. Order: credit, then points, then voucher.</p></div>`,
walCard=()=>`<div class="card"><h2>Credit &amp; points</h2><div class="kv"><span>Account credit</span><b>${E((wal||{}).credit||0)}</b></div><div class="kv"><span>Points</span><b>${(wal||{}).points||0} pts · ${E(((wal||{}).points||0)/50)}</b></div><p class="mu" style="margin:6px 0 0">50 points = €1. You earn 25 points for every €5 you pay. Use them on the “Get a price” page; the shop confirms it in your quote.</p></div>`,
useTxt=o=>{const u=(o.options||{}).use;if(!u)return"";const a=[u.credit?"account credit":"",u.points?(u.points=="all"?"points":u.points+" pts"):"",u.voucher?"voucher "+u.voucher:""].filter(Boolean);return a.length?`<p class="mu" style="margin:4px 0">Applied to this order: ${esc(a.join(" + "))} (confirmed in your quote)</p>`:""},
lnk=(it,i)=>it.kind!="link"?"":`<p style="margin:0 0 10px" class="${it.af=="ok"||it.af=="file"?"ok":"mu"}">${it.af=="loading"?"Reading the page for weight and print time…":it.af=="file"?"Model downloaded from the site and measured. Choose strength and scale like for an uploaded file.":it.af=="ok"?"Weight and print time read from the page. You can adjust them.":it.af=="err"?"Automatic reading isn’t available right now, please enter the weight and time below.":it.af=="none"?"Couldn’t get the model from this page, please enter weight and time below."+(it.why?" ("+esc(it.why)+")":""):""} <button class="btn g s" data-af="${i}">Read page again</button></p>${(it.pr||[]).length>1?`<div style="margin:0 0 10px"><label>Print profile on that page</label><select data-pf="${i}">${it.pr.map((p,k)=>`<option value="${k}" ${k==(it.pi||0)?"selected":""}>${esc(p.n||"Profile "+(k+1))} · ${p.w} g${p.t?" · "+hm(p.t):""}</option>`).join("")}</select></div>`:""}`;
async function autoLink(it){if(!sb)return;it.af="loading";it.why="";it.s=null;it.blob=null;render();
 try{const r=await sb.functions.invoke("model-info",{body:{url:it.url}});if(r.error){it.af="err";return render()}const d=r.data;
  if(d instanceof Blob){const buf=await d.arrayBuffer(),z=new Uint8Array(buf,0,2),zip=z[0]==0x50&&z[1]==0x4b;it.s=zip?await P.threemf(buf):P.stl(buf);it.blob=d;it.ext=zip?".3mf":".stl";it.af="file"}
  else{it.pr=(d&&d.profiles)||[];it.pi=0;if(d&&d.title)it.name=d.title.slice(0,80);it.why=(d&&d.error)||"";const p=it.pr[0];if(p&&p.w){it.w=p.w;it.t=Math.round(p.t||0)||"";it.af="ok"}else it.af="none"}}
 catch(e){it.af="none";it.why=String(e&&e.message||e)}render()}
function refresh(){const e=$("#est");if(e)e.innerHTML=estHtml();items.forEach((it,i)=>{const s=$("#ip"+i),x=itemEst(it);if(s)s.textContent=x?"≈ "+E(sumB(x)):"by hand"})}
const inp=(k,l,t="text",x="")=>`<div><label>${l}</label><input data-f="${k}" type="${t}" value="${esc(F[k])}" ${x}></div>`,
sel=(k,l,m)=>`<div><label>${l}</label><select data-f="${k}">${Object.entries(m).map(([v,t])=>`<option value="${v}" ${F[k]==v?"selected":""}>${esc(t)}</option>`).join("")}</select></div>`,
ii=(i,k,l,t="text",x="")=>`<div><label>${l}</label><input data-i="${i}:${k}" type="${t}" value="${esc(items[i][k])}" ${x}></div>`,
is=(i,k,l,m)=>`<div><label>${l}</label><select data-i="${i}:${k}">${Object.entries(m).map(([v,t])=>`<option value="${v}" ${items[i][k]==v?"selected":""}>${esc(t)}</option>`).join("")}</select></div>`,
MK=Object.fromEntries(Object.keys(P.MAT).map(k=>[k,k])),SK=Object.fromEntries(Object.entries(P.STRENGTH).map(([k,v])=>[k,v.n])),
PL={0:"Auto (same material together)",1:"Plate 1",2:"Plate 2",3:"Plate 3",4:"Plate 4",5:"Plate 5",6:"Plate 6"};
const cblock=(it,i)=>{const n=Math.max(1,+it.cols||1),cs=Math.min(it.cs||0,n-1);return`<div style="margin:0 0 12px"><label>${n>1?"Colours (tap a slot, then a colour)":"Colour"}</label><div class="row" style="margin:4px 0 8px">${Array.from({length:n},(_,k)=>{const c=it.cl[k];return`<button type="button" class="sw big" data-slot="${i}:${k}" style="${c?"background:"+c.h+";":""}${k==cs&&n>1?"outline:2px solid var(--ac);outline-offset:2px":""}" title="${esc(c?c.n:"pick a colour")}">${c?"":k+1}</button>`}).join("")}<span class="mu">${esc(it.cl.slice(0,n).map(c=>c.n).join(" + ")||"no colour chosen")}</span></div>
 <div class="row" style="gap:6px">${pal(it).map((c,x)=>`<button type="button" class="sw" data-pick="${i}:${x}" style="background:${c.h}" title="${esc(c.n)}"></button>`).join("")||'<span class="mu">No colours in stock for this material</span>'}${!AV||AV.custom?`<input type="color" class="sw" data-cc="${i}" title="Custom colour" value="${(it.cl[cs]||{h:"#888888"}).h}">`:""}</div><div style="margin-top:8px">${ii(i,"colour","Colour note (brand, shade…)")}</div></div>`};
const card=(it,i)=>`<div class="card" style="background:var(--bg)"><div class="row" style="justify-content:space-between"><b>${esc(it.name)}</b><button class="btn g s" data-x="${i}">✕</button></div>
 <p class="mu" style="margin:2px 0 10px">${it.kind=="link"?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url.slice(0,60))}</a>`:it.s?(it.s.w?it.s.w.toFixed(0)+" g (sliced file)":it.s.dim.map(v=>v.toFixed(0)).join(" × ")+" mm · "+it.s.vol.toFixed(1)+" cm³"):it.err?"could not read, we will check it":"quoted by hand"}</p>${lnk(it,i)}
 <div class="f">${is(i,"m","Material",MK)}${is(i,"st","Strength",SK)}${is(i,"lh","Detail",{"0.12":"Fine · 0.12 mm","0.2":"Standard · 0.2 mm","0.28":"Draft · 0.28 mm"})}${is(i,"cols","Number of colours",{1:"1 colour",2:"2 colours",3:"3 colours",4:"4 colours",5:"5 colours",6:"6 colours",7:"7 colours",8:"8 colours"})}${is(i,"sup","Supports",{auto:"Automatic",yes:"Yes",no:"No"})}${ii(i,"sc","Scale (%)","number",'min="10" max="500"')}${is(i,"plate","Plate",PL)}${it.kind=="link"&&!it.s?ii(i,"w","Weight (g) from the page","number",'min="0" step="any"')+ii(i,"t","Print time (min)","number",'min="0"'):""}</div>
 ${cblock(it,i)}<div class="row"><span>Print</span><button class="btn g s" data-qty="${i}:-1">−</button><b>×${it.qty}</b><button class="btn g s" data-qty="${i}:1">+</button><button class="btn g s" data-qty="${i}:5">+5</button><span class="mu" id="ip${i}">${(()=>{const x=itemEst(it);return x?"≈ "+E(sumB(x)):"by hand"})()}</span></div></div>`;
function vNew(){return`${user?"":`<div class="msg row" style="justify-content:space-between">Log in to track your orders and send requests faster. <button class="btn g s" data-t="acct">Log in / sign up</button></div>`}
 <div class="card"><h2>Your objects</h2>${inp("name","Name for this order (optional)")}<div class="drop" id="dz" style="margin-top:12px">Drop STL / 3MF files here (several at once), or tap to choose<input id="fi" type="file" multiple hidden accept=".stl,.3mf,.gcode,.obj,.step,.stp,image/*,.pdf"></div>
 <div class="row"><input id="ln" placeholder="Paste a MakerWorld / Printables link" style="flex:1;min-width:200px"><button class="btn g" id="la">Add link</button></div>
 <p class="mu" style="margin:8px 0 0">Every file or link is its own object with its own material, strength, plate and quantity.</p></div>
 ${items.map(card).join("")}${items.length>1?`<div class="row" style="margin-bottom:14px"><button class="btn g s" data-all>Use the first object's settings for all</button></div>`:""}
 <div class="card"><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" data-f="design" ${F.design?"checked":""}>I also need custom design help</label>${F.design?`<div style="margin-top:8px"><label>Describe what you need (size, purpose, where it fits)</label><textarea data-f="desc" rows="3">${esc(F.desc)}</textarea></div>`:""}
 <label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin-top:8px"><input type="checkbox" data-f="buy" ${F.buy?"checked":""}>Some models are paid, please buy them for me (price added to the quote)</label></div>
 <div class="card"><h2>When &amp; where</h2><div class="f">${sel("dm","How",{pickup:"I pick it up",deliver:"Deliver to me",ship:"Ship it"})}${inp("dl","Where (address or place)")}${inp("due","When do you want it? (date)","date",'min="'+new Date().toISOString().slice(0,10)+'"')}${inp("tm","Time (optional)","time")}</div>
 <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" data-f="rush" ${F.rush?"checked":""}>Rush order (+${P.rush}%, goes to the front of the queue)</label><div style="margin-top:10px"><label>Notes</label><textarea data-f="notes" rows="2">${esc(F.notes)}</textarea></div></div>
 ${vSav()}<div class="card" id="est">${estHtml()}</div><div class="row"><button class="btn" id="go" ${busy?"disabled":""}>${busy?"Sending…":"Looks good, send it to the shop"}</button><button class="btn g" id="clr">No thanks, clear</button></div>`}
async function addFiles(list){for(const file of list){const it={...dflt(),kind:"file",name:file.name,file};items.push(it);try{const n=file.name.toLowerCase();if(n.endsWith(".stl"))it.s=P.stl(await file.arrayBuffer());else if(n.endsWith(".3mf"))it.s=await P.threemf(await file.arrayBuffer());else if(n.endsWith(".gcode"))it.s=P.gcode(file.size>6e5?(await file.slice(0,3e5).text())+(await file.slice(-3e5).text()):await file.text());else if(n.endsWith(".obj"))it.s=P.obj(await file.text())}catch(e){it.err=1}}render()}
async function send(){if(!sb)return say("The shop is not connected yet (config.js).",1);if(!user){pend=true;view="auth";say("Log in or sign up and your request is sent automatically.");return render()}
 if(!items.length&&!(F.design&&F.desc.trim()))return say("Add a file or link first, or describe the design you need.",1);
 busy=true;render();const id=crypto.randomUUID(),paths=[],c=calc();
 try{const its=[];for(const[i,it]of items.entries()){let path=null;if(it.kind=="file"||it.blob){path=`${user.id}/${id}/${i}_${(it.name+(it.kind=="file"?"":it.ext||"")).replace(/[^\w.\-]/g,"_")}`;const u=await sb.storage.from("uploads").upload(path,it.file||it.blob);if(u.error)throw u.error;paths.push(path)}
  const e=itemEst(it);its.push({name:it.name,kind:it.kind,url:it.url||null,path,m:it.m,st:it.st,lh:+it.lh,colour:it.colour,cl:it.cl.slice(0,Math.max(1,+it.cols||1)),cols:+it.cols,qty:+it.qty,sup:it.sup,sc:+it.sc,plate:+it.plate,w:it.w,t:it.t,est:e?{w:e.w,t:e.t,sp:e.sp,price:sumB(e)}:null})}
  const kinds=[...new Set(items.map(i=>i.kind))],est=c?{w:c.w,t:c.t,sp:c.sp,b:c.b,rush:c.rush,total:c.total,pay:sav(c.total)}:null;
  const r=await sb.from("requests").insert({id,user_id:user.id,name:F.name||(items[0]?items[0].name+(items.length>1?` +${items.length-1}`:""):"Design request"),source:!items.length?"design":kinds.length>1?"mixed":kinds[0],links:items.filter(i=>i.kind=="link").map(i=>i.url),files:paths,
   options:{items:its,m:domMat(),rush:F.rush,tm:F.tm,buy:F.buy,design:F.design,desc:F.desc,use:usePay()},est,est_price:est?est.total:null,due:F.due||null,delivery_method:F.dm,delivery_where:F.dl,notes:F.notes});
  if(r.error)throw r.error;items=[];Object.assign(F,{name:"",desc:"",buy:false,design:false,notes:"",uc:false,up:false,pts:"",vc:"",vd:null});busy=false;say("Sent! We will look at it and send you a quote. Track it here.");view="orders";await load()}
 catch(err){busy=false;say("Could not send: "+(err.message||err),1);render()}}
async function loadProf(){const r=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();prof=r.data}
async function load(){if(!user)return;if(!prof)await loadProf();await loadWal();const r=await sb.from("requests").select("*").order("created_at",{ascending:false});if(r.data){orders=r.data;if(view=="orders")render()}}
const vOrders=()=>!user?`<div class="card">Log in to follow your orders.</div>`:orders.length?orders.map(o=>{const cur=STEPS.indexOf(o.status),x=o.est||{};return`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(o.name)}</b><span class="tag">${ST[o.status]||o.status}</span></div>
 <p class="mu" style="margin:4px 0">${new Date(o.created_at).toLocaleDateString()} · ${o.quoted_price!=null?(["accepted","in_queue","printing","ready","delivered"].includes(o.status)?"Final price ":"Quote ")+E(o.quoted_price)+(o.paid?" · paid":""):x.total!=null?"Estimate ≈ "+E(x.total):"Price after review"}${o.due?" · wanted by "+o.due+((o.options||{}).tm?" "+o.options.tm:""):""}${o.delivery_where?" · "+esc(o.delivery_method)+": "+esc(o.delivery_where):""}</p>
 ${((o.options||{}).items||[]).length?`<p class="mu" style="margin:4px 0">${o.options.items.map(i=>esc(i.name)+" ×"+i.qty+" "+i.m).join(" · ")}</p>`:""}${cur>=0?`<p style="margin:6px 0">${STEPS.map((s,i)=>`<span class="${i<=cur?"ok":"mu"}">${ST[s]}</span>`).join(" › ")}</p>`:""}${useTxt(o)}${o.admin_note?`<p class="wn">Message from the shop: ${esc(o.admin_note)}</p>`:""}
 <div class="row">${o.status=="quoted"?`<button class="btn s" data-q="${o.id}:1">Accept quote</button><button class="btn g s" data-q="${o.id}:0">Decline</button>`:""}${["new","quoted"].includes(o.status)?`<button class="btn g s" data-c="${o.id}">Cancel request</button>`:""}<button class="btn g s" data-again="${o.id}">Order again</button></div></div>`}).join(""):`<div class="card mu">No orders yet.</div>`;
const vAcct=()=>!user?vAuth():`<div class="card"><h2>Account</h2><div class="kv"><span>Name</span><span>${esc(user.user_metadata?.name||"")}</span></div><div class="kv"><span>Email</span><span>${esc(user.email)}</span></div><div class="f"><div><label>Phone (shared with the shop when you accept a quote)</label><input id="pp" type="tel" value="${esc(prof?.phone)}"></div><div><label>Address</label><input id="pa" value="${esc(prof?.address)}"></div></div><label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin:0 0 12px"><input type="checkbox" id="pe" ${prof&&prof.email_updates===false?"":"checked"}>Email me updates about my orders</label><div class="row"><button class="btn s" id="ps">Save details</button></div><p class="mu">You stay logged in on this device until you log out.</p><button class="btn g" id="lo">Log out</button></div>
 ${walCard()}<div class="card"><h2>Prices</h2><p class="mu">Materials per kg (before print costs)</p>${Object.entries(P.MAT).map(([k,v])=>`<div class="kv"><span>${k}</span><span>${E(v*P.mult)}</span></div>`).join("")}<p class="mu">Machine time ${E(P.machine)}/h · minimum order ${E(P.min)} · rush +${P.rush}%</p></div>`;
const vAuth=()=>`<div class="card" style="max-width:380px;margin:0 auto"><h2>${auth.up?"Create account":"Log in"}</h2>${auth.up?`<label>Name</label><input id="an" autocomplete="name"><label style="margin-top:8px">Phone</label><input id="aph" type="tel" autocomplete="tel">`:""}<label style="margin-top:8px">Email</label><input id="ae" type="email" autocomplete="email"><label style="margin-top:8px">Password</label><input id="ap" type="password" autocomplete="${auth.up?"new-password":"current-password"}" minlength="6">
 <div class="row" style="margin-top:12px"><button class="btn" id="ao">${auth.up?"Sign up":"Log in"}</button><button class="btn g" id="at">${auth.up?"I have an account":"New here? Sign up"}</button></div>${auth.pending?`<p class="mu" style="margin:14px 0 6px">Waiting for the confirmation of <b>${esc(auth.pending)}</b>. Nothing arrived? Check spam, then:</p><button class="btn g s" id="rs">Send the email again</button>`:""}</div>`;
function render(){$("#nav").innerHTML=[["new","Get a price"],["orders","My orders"],["acct","Account"]].map(t=>`<button class="${t[0]==view||(view=="auth"&&t[0]=="acct")?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");$("#lg").textContent=user?"Log out":"Log in";
 if(!sb)say("Shop not connected yet: add your Supabase details in config.js.",1);$("#v").innerHTML=({new:vNew,orders:vOrders,acct:vAcct,auth:vAuth})[view]();
 document.querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>{const k=el.dataset.f;F[k]=el.type=="checkbox"?el.checked:el.value;if(k=="design"||k=="up")return render();refresh()});
 const dz=$("#dz"),fi=$("#fi");if(dz){dz.onclick=()=>fi.click();fi.onchange=()=>addFiles([...fi.files]);dz.ondragover=e=>{e.preventDefault();dz.classList.add("h")};dz.ondragleave=()=>dz.classList.remove("h");dz.ondrop=e=>{e.preventDefault();addFiles([...e.dataTransfer.files])}}
 document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{items.splice(+b.dataset.x,1);render()});
 document.querySelectorAll("[data-i]").forEach(el=>el.oninput=()=>{const[i,k]=el.dataset.i.split(":");items[+i][k]=el.value;if(k=="cols"||k=="m")return render();refresh()});
 document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{const[i,k]=b.dataset.slot.split(":");items[+i].cs=+k;render()});
 const setC=(i,c)=>{const it=items[i],n=Math.max(1,+it.cols||1),k=Math.min(it.cs||0,n-1);it.cl[k]=c;const nx=Array.from({length:n},(_,j)=>j).find(j=>j>k&&!it.cl[j]);if(nx!==undefined)it.cs=nx;render()};
 document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const[i,x]=b.dataset.pick.split(":"),c=pal(items[+i])[+x];if(c)setC(+i,{n:c.n,h:c.h})});
 document.querySelectorAll("[data-cc]").forEach(el=>el.onchange=()=>setC(+el.dataset.cc,{n:nearest(el.value)+" (custom)",h:el.value}));
 document.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.qty.split(":");items[+i].qty=Math.max(1,(+items[+i].qty||1)+ +d);render()});
 const al=$("[data-all]");if(al)al.onclick=()=>{const{m,st,lh,colour,cols,sup,sc,cl}=items[0];items.forEach(it=>Object.assign(it,{m,st,lh,colour,cols,sup,sc,cl:cl.slice(),cs:0}));render()};
 const la=$("#la");if(la)la.onclick=()=>{const u=$("#ln").value.trim();if(!/^https?:\/\//i.test(u))return say("Paste a full link starting with https://",1);const it={...dflt(),kind:"link",url:u,name:site(u)+" model"};items.push(it);say("");render();autoLink(it)};
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{view=b.dataset.t;if(view=="acct"&&!user)view="auth";say("");render();if(view=="orders")load()});
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=async()=>{const[i,a]=b.dataset.q.split(":");if(a=="1"){if(!prof)await loadProf();if(!prof||!(prof.phone||"").trim()){const ph=prompt("Phone number, so the shop can reach you about this order:");if(!ph||ph.trim().length<6)return say("A phone number is needed to accept.",1);const u=await sb.from("profiles").update({phone:ph.trim()}).eq("id",user.id);if(u.error)return say(u.error.message,1);await loadProf()}}
  const r=await sb.rpc("respond_to_quote",{rid:i,accept:a=="1"});if(r.error)say(r.error.message,1);else say(a=="1"?"Accepted! The shop now has your contact details and will prepare the final price.":"");load()});
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{if(confirm("Cancel this request?")){await sb.rpc("cancel_request",{rid:b.dataset.c});load()}});
 document.querySelectorAll("[data-again]").forEach(b=>b.onclick=()=>{const o=orders.find(x=>x.id==b.dataset.again),p=o.options||{},L=(p.items||[]);
  items=L.filter(i=>i.kind=="link").map(i=>({...dflt(),kind:"link",url:i.url,name:i.name,m:i.m,st:i.st,lh:i.lh,colour:i.colour||"",cl:i.cl||[],cols:i.cols||1,qty:i.qty||1,sup:i.sup||"auto",sc:i.sc||100,plate:i.plate||0,w:i.w||"",t:i.t||""}));
  Object.assign(F,{name:o.name,rush:!!p.rush,buy:!!p.buy,design:!!p.design,desc:p.desc||"",dm:o.delivery_method||"pickup",dl:o.delivery_where||"",notes:o.notes||"",due:"",tm:""});
  view="new";say(L.some(i=>i.kind=="file")?"Link objects and settings copied. Please add your file(s) again.":"Settings copied. Check them and send.");render()});
 document.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>autoLink(items[+b.dataset.af]));
 document.querySelectorAll("[data-pf]").forEach(s=>s.onchange=()=>{const it=items[+s.dataset.pf],p=it.pr[+s.value];it.pi=+s.value;it.w=p.w;it.t=Math.round(p.t||0)||"";render()});
 const va=$("#va");if(va)va.onclick=async()=>{const c=$("#vc").value.trim();if(!c)return;F.vc=c;const r=await sb.rpc("check_voucher",{code:c});if(r.error)return say(r.error.message,1);F.vd=r.data;say("");render()};
 const vx=$("#vx");if(vx)vx.onclick=()=>{F.vd=null;F.vc="";render()};
 const g=$("#go");if(g)g.onclick=send;const c=$("#clr");if(c)c.onclick=()=>{items=[];Object.assign(F,{name:"",links:"",desc:"",w:"",t:"",buy:false,notes:""});say("");render()};
 const ps=$("#ps");if(ps)ps.onclick=async()=>{const r=await sb.from("profiles").update({phone:$("#pp").value.trim(),address:$("#pa").value.trim(),email_updates:$("#pe").checked}).eq("id",user.id);if(r.error)return say(r.error.message,1);await loadProf();say("Saved")};
 const lo=$("#lo");if(lo)lo.onclick=out;const at=$("#at");if(at)at.onclick=()=>{auth.up=!auth.up;render()};
 const ao=$("#ao");if(ao)ao.onclick=async()=>{if(!sb)return;const e=$("#ae").value.trim(),p=$("#ap").value;say("");
  const r=auth.up?await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname,data:{name:($("#an").value||"").trim(),phone:($("#aph").value||"").trim()}}}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){if(/not confirmed/i.test(r.error.message))auth.pending=e;say(r.error.message,1);return render()}if(auth.up&&!r.data.session){auth.pending=e;say("Check your email (and spam) for the confirmation link. It brings you back here, already logged in.");render()}};
 const rs=$("#rs");if(rs)rs.onclick=async()=>{const r=await sb.auth.resend({type:"signup",email:auth.pending,options:{emailRedirectTo:location.origin+location.pathname}});say(r.error?r.error.message:"Confirmation email sent again to "+auth.pending+".",!!r.error)}}
async function out(){if(sb)await sb.auth.signOut();user=null;prof=null;wal=null;orders=[];view="new";render()}
$("#lg").onclick=()=>user?out():(view="auth",render());
if(sb){sb.auth.onAuthStateChange((ev,s)=>{user=s?s.user:null;if(user){if(view=="auth")view=pend?"new":"orders";load();if(pend){pend=false;send()}}render()});
 const hh=location.hash;if(/type=signup/.test(hh))say("Email confirmed. You are logged in.");else if(/error_description=/.test(hh))say(decodeURIComponent((hh.match(/error_description=([^&]+)/)[1]).replace(/\+/g," "))+". Log in or request a new confirmation email.",1);
 sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;if(user)load();render()});setInterval(()=>{if(view=="orders"&&!document.hidden)load()},20000)}
if(sb)sb.from("public_settings").select("value").eq("key","colors").maybeSingle().then(r=>{if(r.data){AV=r.data.value;render()}});
render();
</script></body></html>
