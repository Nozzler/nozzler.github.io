<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Print Desk</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f3ee;--sf:#fff;--tx:#1c1b18;--mu:#6d6a62;--bd:#e3e0d8;--ac:#c2410c;--ok:#15803d;--wn:#b45309;--er:#b91c1c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151411;--sf:#201e1a;--tx:#f0ede6;--mu:#a09b8f;--bd:#37342d;--ac:#fb923c;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151411;--sf:#201e1a;--tx:#f0ede6;--mu:#a09b8f;--bd:#37342d;--ac:#fb923c;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--sf)}
h1{font-size:18px;margin:0 10px 0 0}h1 span{color:var(--ac)}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}nav button{white-space:nowrap}nav button{border:0;background:none;color:var(--mu);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{max-width:1060px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px}
.kpi b{display:block;font-size:26px;letter-spacing:-.5px}.kpi small{color:var(--mu)}
h2{font-size:15px;margin:0 0 12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
tr[data-a]{cursor:pointer}tr[data-a]:hover td{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--mu) 18%,transparent)}
.er{color:var(--er)}.pr-urgent{background:color-mix(in srgb,var(--er) 18%,transparent);color:var(--er);font-weight:600}.pr-high{background:color-mix(in srgb,var(--wn) 22%,transparent);color:var(--wn)}.pr-low{opacity:.7}.st-printing{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}.st-ready,.st-delivered{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.acts{display:flex;gap:4px;align-items:center}
.ok{color:var(--ok)}.wn{color:var(--wn)}.mu{color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:2px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.g{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.s{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.row input,.row select{width:auto;min-width:150px}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
.bar{height:8px;border-radius:4px;background:var(--ac);min-width:2px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:18px;text-align:center;color:var(--mu);margin-bottom:14px;cursor:pointer}
.drop.h{border-color:var(--ac);color:var(--ac)}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;justify-content:flex-end}
.pn{background:var(--sf);width:min(440px,100%);height:100%;overflow:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:30}
.bl{display:grid;grid-template-columns:110px 1fr 60px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
svg text{fill:var(--mu);font-size:11px}
.paper{background:#fffdf6;color:#222;font:13px/1.5 ui-monospace,Menlo,monospace;padding:18px 18px 22px;border-radius:4px;box-shadow:0 2px 10px #0003;max-width:360px;margin:0 auto}
.paper hr{border:0;border-top:1px dashed #999;margin:9px 0}.rh{font-size:20px;font-weight:700;text-align:center}.rcn{text-align:center;letter-spacing:2px}.rt{font-weight:700;margin-bottom:2px}.kv{display:flex;justify-content:space-between;gap:10px}.kv span:last-child{text-align:right}.bg{font-size:17px;font-weight:700}
.stp{font-weight:800;font-size:22px;letter-spacing:3px;border:3px solid;border-radius:6px;padding:2px 10px;margin:12px auto 8px;width:max-content;transform:rotate(-6deg)}.stp.p{color:#15803d}.stp.o{color:#b45309}
@media print{header,main,#ts{display:none!important}.ov{position:static;background:none}.pn{width:100%;overflow:visible;padding:0}.pn>:not(.pw){display:none!important}}
</style><link rel="stylesheet" href="../shared/ui.css"></head><body>
<header><h1>3D Print <span>Desk</span></h1><nav id="nav"></nav><span style="flex:1"></span>
<button class="btn g s" data-a="th">Theme</button></header>
<main id="app"></main><div id="md"></div><div id="ts"></div><datalist id="locs"></datalist>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script><script src="../shared/pricing.js"></script>
<script>
const SEED={"bills":[],"cards":[],"accounts":[],"tx":[],"types":[["one_free","1 Free 3D Print","voucher",100,0],["two_free","2 Free 3D Prints","voucher",100,0],["three_free","3 Free 3D Prints","voucher",100,0],["five_free","5 Free 3D Prints","voucher",100,0],["ten_free","10 Free 3D Prints","voucher",100,0],["discount_10","10% 3D Print Discount","voucher",10,0],["discount_20","20% 3D Print Discount","voucher",20,0],["friendship_discount","Friendship Discount (25% Forever)","voucher",25,1],["discount_30","30% 3D Print Discount","voucher",30,0],["discount_40","40% 3D Print Discount","voucher",40,0],["discount_50","50% 3D Print Discount","voucher",50,0],["discount_60","60% 3D Print Discount","voucher",60,0],["discount_70","70% 3D Print Discount","voucher",70,0],["discount_80","80% 3D Print Discount","voucher",80,0],["discount_90","90% 3D Print Discount","voucher",90,0],["account_card","Account Card","account",0,0]]};
const E=n=>"€"+(+n).toFixed(2),$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o)),today=()=>new Date().toISOString().slice(0,10);
let S;try{S=JSON.parse(localStorage.getItem("p3d2")||"null")}catch(e){}S=S||clone(SEED);
const save=()=>{try{localStorage.setItem("p3d2",JSON.stringify(S))}catch(e){}window.onSaved&&window.onSaved()};
const T=Object.fromEntries(SEED.types.map(t=>[t[0],t]));
const TABS=["Dashboard","Bills","Queue","Labels","Requests","Customers","Colors","Cards","Accounts","Quote","History","Scan","Settings"];
let tab=(location.hash||"#Dashboard").slice(1);if(!TABS.includes(tab))tab="Dashboard";
let q="",fl="all",Q={w:40,t:90,s:0,c:0,x:PRICING.mult,m:"PLA",name:"",acct:"",v:"",tip:0,mf:0,df:0,ml:"",rid:"",pr:"normal",dd:"",tm:"",dm:"pickup",dl:""},modal="";
const MAT=PRICING.MAT;
const BK={material:"Material",machine_time:"Machine time",support_removal:"Support removal",color_changes:"Colour changes",model_fee:"Online model purchase",design_fee:"Custom design"};
function toast(m){$("#ts").innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>$("#ts").innerHTML="",2200)}
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){toast("Copy blocked: select the text manually")}};
const tbl=(h,r,nc=[])=>`<div class="tw"><table><tr>${h.map((x,i)=>`<th class="${nc.includes(i)?"n":""}">${x}</th>`).join("")}</tr>${r.map(x=>`<tr ${x.a?`data-a="${x.a}"`:""}>${x.c.map((y,i)=>`<td class="${nc.includes(i)?"n":""}">${y}</td>`).join("")}</tr>`).join("")}</table></div>`;
const find=a=>S.accounts.find(x=>x[0].toUpperCase()==String(a).toUpperCase());
const vch=()=>S.cards.filter(c=>T[c[1]]&&T[c[1]][2]=="voucher"&&(T[c[1]][4]||!c[4]));
function calc(){if(Q.plates&&Q.plates.length){
  const b={material:0,machine_time:0,support_removal:0,color_changes:0,model_fee:+Q.mf||0,design_fee:+Q.df||0};
  let totalW=0,totalT=0,totalS=0,totalC=0;
  Q.plates.forEach(p=>{
    const pm=MAT[p.m]?p.m:Q.m,pb={
      material:rnd((MAT[pm]||25)*p.w/1000*Q.x),
      machine_time:rnd(PRICING.machine*p.t/60),
      support_removal:rnd(PRICING.support*(p.s||0)),
      color_changes:rnd(PRICING.color*(p.c||0))
    };
    p.b=pb;p.base=rnd(Object.values(pb).reduce((a,x)=>a+x,0));
    b.material=rnd(b.material+pb.material);b.machine_time=rnd(b.machine_time+pb.machine_time);
    b.support_removal=rnd(b.support_removal+pb.support_removal);b.color_changes=rnd(b.color_changes+pb.color_changes);
    totalW+=p.w;totalT+=p.t;totalS+=(p.s||0);totalC+=(p.c||0);
  });
  Q.w=Math.round(totalW*10)/10;Q.t=Math.round(totalT);Q.s=Math.round(totalS*100)/100;Q.c=totalC;
  const base=rnd(Object.values(b).reduce((a,x)=>a+x,0)),ac=find(Q.acct),v=S.cards.find(c=>c[0]==Q.v),pct=v?T[v[1]][3]:0;
  let rem=base,cr=0,pt=0,pv=0;
  if(ac&&Q.uc){cr=rnd(Math.min(ac[2],rem));rem=rnd(rem-cr)}
  if(ac&&Q.up&&rem>0){const rq=Q.pts===""||Q.pts==null?ac[1]:Math.max(0,Math.floor(+Q.pts||0));pt=Math.min(ac[1],Math.floor(rem*50),rq);pv=rnd(pt/50);rem=rnd(Math.max(rem-pv,0))}
  const vd=rnd(rem*pct/100);rem=rnd(rem-vd);return{b,base,pct,cr,pt,pv,vd,sub:rem,due:rnd(rem+(+Q.tip||0))}
 }
 const b={material:MAT[Q.m]*Q.w/1000*Q.x,machine_time:PRICING.machine*Q.t/60,support_removal:PRICING.support*Q.s,color_changes:PRICING.color*Q.c,model_fee:+Q.mf||0,design_fee:+Q.df||0};
 for(const k in b)b[k]=Math.round(b[k]*100)/100;const base=Math.round(Object.values(b).reduce((a,x)=>a+x,0)*100)/100;
 const ac=find(Q.acct),v=S.cards.find(c=>c[0]==Q.v),pct=v?T[v[1]][3]:0;let rem=base,cr=0,pt=0,pv=0;
 if(ac&&Q.uc){cr=rnd(Math.min(ac[2],rem));rem=rnd(rem-cr)}
 if(ac&&Q.up&&rem>0){const rq=Q.pts===""||Q.pts==null?ac[1]:Math.max(0,Math.floor(+Q.pts||0));pt=Math.min(ac[1],Math.floor(rem*50),rq);pv=rnd(pt/50);rem=rnd(Math.max(rem-pv,0))}
 const vd=rnd(rem*pct/100);rem=rnd(rem-vd);return{b,base,pct,cr,pt,pv,vd,sub:rem,due:rnd(rem+(+Q.tip||0))}}
function dashBase(){const b=S.bills,paid=b.filter(x=>x[6]),rev=paid.reduce((a,x)=>a+x[5],0),open=b.filter(x=>!x[6]).reduce((a,x)=>a+x[5],0);
  const m={};b.forEach(x=>{const k=x[2].slice(0,7);m[k]=(m[k]||0)+x[5]});const ks=Object.keys(m).sort(),mx=Math.max(...ks.map(k=>m[k]),1);
  const bw=Math.min(46,560/ks.length-8),svg=`<svg viewBox="0 0 600 190" width="100%">${ks.map((k,i)=>{const h=m[k]/mx*130,x=20+i*(560/ks.length);return`<rect x="${x}" y="${150-h}" width="${bw}" height="${h}" rx="4" fill="var(--ac)"/><text x="${x+bw/2}" y="168" text-anchor="middle">${k.slice(2)}</text><text x="${x+bw/2}" y="${144-h}" text-anchor="middle">${Math.round(m[k])}</text>`}).join("")}</svg>`;
  const by={};b.forEach(x=>by[x[3]]=(by[x[3]]||0)+x[5]);const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,6),tm=top[0]?top[0][1]:1;
  const mats={};b.forEach(x=>{const c=x[8]||{};for(const k in BK)mats[k]=(mats[k]||0)+(c[k]||0)});const mt=Math.max(...Object.values(mats),1);
  return`<div class="grid">${[["Paid revenue",E(rev)],["Open bills",E(open)],["Tips",E(b.reduce((a,x)=>a+(x[7]||0),0))],["Avg bill",E(b.length?b.reduce((a,x)=>a+x[5],0)/b.length:0)],["Active vouchers",vch().length],["Accounts",S.accounts.length]].map(k=>`<div class="card kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join("")}</div>
  <div class="card" style="margin-bottom:14px"><h2>Billed per month (€)</h2>${svg}</div>
  <div class="two"><div class="card"><h2>Top customers</h2>${top.map(t=>`<div class="bl"><span>${esc(t[0])}</span><div class="bar" style="width:${t[1]/tm*100}%"></div><span class="n">${E(t[1])}</span></div>`).join("")}</div>
  <div class="card"><h2>Where the money comes from</h2>${Object.keys(BK).map(k=>`<div class="bl"><span>${BK[k]}</span><div class="bar" style="width:${mats[k]/mt*100}%"></div><span class="n">${E(mats[k])}</span></div>`).join("")}</div></div>`}
function bills(){const r=S.bills.filter(x=>(fl=="all"||(fl=="paid")==!!x[6])&&x.slice(0,4).join(" ").toLowerCase().includes(q.toLowerCase())).sort(SO[so]);
  return`<div class="row"><input id="q" placeholder="Search bills…" value="${esc(q)}"><select id="fl">${["all","open","paid"].map(o=>`<option ${o==fl?"selected":""}>${o}</option>`)}</select><select id="so">${Object.keys(SO).map(o=>`<option ${o==so?"selected":""}>${o}</option>`)}</select><span class="mu">${r.length} bills · ${E(r.reduce((a,x)=>a+x[5],0))}</span></div><div class="card">${tbl(["ID","Name","Date","Account","Base","Due","Status","Queue"],r.map(x=>({a:"b:"+x[0],c:[`<span class="mono">${x[0]}</span>`,esc(x[1]),x[2],esc(x[3]),E(x[4]),E(x[5]),x[6]?`<span class="ok">Paid</span>`:x[14]=="quote"?(window.reqAcc&&reqAcc(x)?`<span class="ok">✓ Accepted by customer</span>`:`<span class="tag">Quote</span>`):x[14]=="confirmed"?`<span class="tag">Confirmed</span>`:`<span class="wn">Open${ageTxt(x[2])}</span>`,qTag(x)]})),[4,5])}</div>`}
function cardsBase(){const r=S.cards.filter(x=>x.join(" ").toLowerCase().includes(q.toLowerCase()));
  return`<div class="card" style="margin-bottom:14px"><h2>Generate cards</h2><div class="f"><div><label>Type</label><select id="gt">${SEED.types.map(t=>`<option value="${t[0]}">${esc(t[1])}</option>`)}</select></div><div><label>Amount</label><input id="gn" type="number" min="1" max="50" value="1"></div><div><label>Account ID (account cards)</label><input id="ga" placeholder="e.g. LILY"></div></div><button class="btn" data-a="gen">Generate</button></div>
  <div class="row"><input id="q" placeholder="Search cards…" value="${esc(q)}"><span class="mu">${r.length} cards</span></div><div class="card">${tbl(["Serial","Type","Created","Account","Status"],r.map(x=>({a:"c:"+x[0],c:[`<span class="mono">${x[0]}</span>`,esc(x[2]),x[3],esc(x[5]||"–"),T[x[1]]&&T[x[1]][2]=="account"?`<span class="tag">account</span>`:T[x[1]]&&T[x[1]][4]?`<span class="ok">Unlimited</span>`:x[4]?`<span class="wn">Used</span>`:`<span class="ok">Active</span>`]})))}</div>`}
function accts(){return`<div class="card" style="margin-bottom:14px"><h2>New account</h2><div class="row"><input id="na" placeholder="Account ID"><button class="btn" data-a="na">Create</button></div></div><div class="card">${tbl(["Account","Points","Balance","Bills","Created"],S.accounts.map(a=>({a:"a:"+a[0],c:[esc(a[0]),a[1],E(a[2]),S.bills.filter(b=>b[3].toUpperCase()==a[0].toUpperCase()).length,a[3]]})),[1,2,3])}</div>`}
function platesCard(c){if(!Q.plates||!Q.plates.length)return"";
  const pl=Q.plates,tot=Q.projectTotalPlates||pl.length;
  const wn=tot>pl.length?`<div class="msg wn" style="margin:0 0 10px;font-size:13px">ℹ Detected Plate ${pl.map(p=>p.plateNum).join(", ")} (${pl.length} of ${tot} plates in Bambu Studio). Drop the other plate files (.gcode.3mf) here to add them to this quote.</div>`:"";
  return`<div class="card" style="background:var(--bg);margin:0 0 14px;padding:12px;border:1px solid var(--bd)">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b>Plates (${pl.length}${tot>pl.length?" of "+tot:""})</b>
      <span class="mu">${Q.w.toFixed(1)} g · ${hm(Q.t)} · <b>${E(c.base)}</b></span>
    </div>${wn}
    <div style="display:flex;flex-direction:column;gap:6px">
      ${pl.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;background:var(--sf);padding:6px 10px;border-radius:8px;border:1px solid var(--bd)">
        ${p.th?`<img src="${p.th}" style="width:44px;height:44px;object-fit:contain;border-radius:6px;background:var(--bg);border:1px solid var(--bd);flex-shrink:0" alt="P${p.plateNum}">`:`<div style="width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border-radius:6px;font-weight:700;font-size:12px;color:var(--mu);flex-shrink:0">P${p.plateNum}</div>`}
        <div style="flex:1;min-width:0">
          <div class="row" style="margin:0;gap:6px;align-items:baseline">
            <span class="tag pr-high" style="font-weight:600">Plate ${p.plateNum}</span>
            <b style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(p.name)}">${esc(p.name)}</b>
          </div>
          <div class="mu" style="font-size:12px;margin-top:2px">${p.w.toFixed(1)} g · ${hm(p.t)}${p.L?" · "+p.L+" layers":""}${p.s?" · "+p.s+" cm³ sup":""}${p.c?" · "+p.c+" cols":""}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <select data-pm="${i}" style="width:auto;padding:3px 6px;font-size:12px">
            ${Object.keys(MAT).map(k=>`<option value="${k}" ${(p.m||Q.m)==k?"selected":""}>${k}</option>`).join("")}
          </select>
          <b style="font-size:13px;min-width:55px;text-align:right">${E(p.base||0)}</b>
          <button class="btn g s" data-a="rmp:${i}" title="Remove plate" style="padding:2px 7px;font-size:12px">✕</button>
        </div>
      </div>`).join("")}
    </div>
  </div>`}
function quoteBase(){const c=calc(),i=(k,l,t="number",s="")=>`<div><label>${l}</label><input data-q="${k}" type="${t}" ${t=="number"?'min="0" step="any"':""} value="${Q[k]}" ${s}></div>`;
  return`<div class="two"><div class="card"><h2>Print quote</h2><div class="drop" id="dz">Drop Bambu Studio .gcode.3mf or .gcode here (single file or multiple plates)<input id="gf" type="file" accept=".3mf,.gcode,.txt" multiple hidden></div>
  <div class="row" style="margin:0 0 12px"><button class="btn g s" data-a="al">Auto-fill weight &amp; time from the model link</button>${(Q.plates&&Q.plates.length)?`<button class="btn g s" data-a="addp">+ Add more plates</button><button class="btn g s" data-a="ca">Clear plates</button>`:""}</div>
  ${platesCard(c)}

const acctBox=c=>{const ac=find(Q.acct);if(!ac)return"";const ck=(k,t)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin:0"><input type="checkbox" data-q="${k}" ${Q[k]?"checked":""} style="width:auto">${t}</label>`;

/* print queue */
const PRI={urgent:["Urgent",0],high:["High",1],normal:["Normal",2],low:["Low",3]},STA={queued:"Queued",printing:"Printing",ready:"Ready",delivered:"Delivered"},
DLM={none:"No delivery needed",pickup:"Customer pickup",deliver:"I deliver",ship:"Ship"},SH={none:"–",pickup:"Pickup",deliver:"Deliver",ship:"Ship"},
NXT={queued:["printing","Start"],printing:["ready","Finish"],ready:["delivered","Hand over"]},QF={st:"active",pr:"",dm:"",so:"priority"};
const QD=b=>({st:b[6]?"delivered":"",pr:"normal",due:"",tm:"",dm:"pickup",loc:"",note:"",o:0,dd:"",...b[16]}),QE=b=>b[16]=QD(b),isAct=b=>!!NXT[QD(b).st],
nextOrd=()=>Math.max(0,...S.bills.map(b=>QD(b).o||0))+1,qEnter=b=>{const o=QE(b);if(!o.st){o.st="queued";o.o=nextOrd()}},
locOpts=()=>[...new Set(S.bills.map(b=>QD(b).loc.trim()).filter(Boolean))].map(l=>`<option value="${esc(l)}">`).join(""),
prTag=p=>`<span class="tag pr-${p}">${(PRI[p]||PRI.normal)[0]}</span>`,
qTag=b=>{const o=QD(b);return o.st?`<span class="tag st-${o.st}">${STA[o.st]}</span>`:"–"},
dueKey=o=>(o.due||"9999")+" "+(o.tm||"23:59");
function qSort(L){const m=QF.so;return L.slice().sort((a,b)=>{const x=QD(a),y=QD(b),pin=m!="manual"?(x.st=="printing"?0:1)-(y.st=="printing"?0:1):0;
  const pr=PRI[x.pr][1]-PRI[y.pr][1],du=dueKey(x).localeCompare(dueKey(y)),mn=(x.o||0)-(y.o||0);
  return pin||(m=="due"?du||pr:m=="manual"?mn:pr||du)||a[2].localeCompare(b[2])})}
function qEta(){const L=qSort(S.bills.filter(isAct)),pd=+CF().pd||16,M={};let cum=0;
  L.forEach(b=>{const o=QD(b);if(o.st!="ready")cum+=+(b[11]||{}).t||0;const eta=new Date(Date.now()+cum/(60*pd)*864e5).toISOString().slice(0,10);M[b[0]]={eta,risk:!!(o.due&&o.st!="ready"&&eta>o.due)}});return M}
function dueTxt(b){const o=QD(b);if(!o.due)return'<span class="mu">–</span>';const d=Math.round((new Date(o.due)-new Date(today()))/864e5),t=o.tm?" "+esc(o.tm):"";
  if(o.st=="delivered")return o.due+t;return d<0?`<span class="er">${o.due} · ${-d}d late</span>`:d==0?`<span class="wn">Today${t}</span>`:d==1?`<span class="wn">Tomorrow${t}</span>`:`${o.due}${t} <span class="mu">· ${d}d</span>`}
function whereTxt(b){const o=QD(b);return o.dm=="none"?'<span class="mu">–</span>':SH[o.dm]+(o.loc?": "+esc(o.loc):"")}
function QRows(R,b){const o=QD(b),nl=CF().lang=="nl";if(o.due)R.push(["kv",nl?"Gewenst op":"Needed by",o.due+(o.tm?" "+o.tm:"")]);
  if(o.dm!="none"&&o.loc)R.push(["kv",o.dm=="pickup"?(nl?"Ophalen":"Pickup"):o.dm=="ship"?(nl?"Verzenden":"Ship"):(nl?"Bezorgen":"Deliver"),o.loc])}
function qPanel(b){const o=QD(b),id=b[0],at=k=>`data-qf="${k}" data-qi="${id}"`,
  sel=(k,m)=>`<select ${at(k)}>${Object.keys(m).map(v=>`<option value="${v}" ${o[k]==v?"selected":""}>${esc(Array.isArray(m[v])?m[v][0]:m[v])}</option>`).join("")}</select>`;
  return`<div class="card" style="margin-bottom:12px"><h2>Queue &amp; delivery</h2><div class="f"><div><label>Status</label>${sel("st",{"":"Not in queue",...STA})}</div><div><label>Priority</label>${sel("pr",PRI)}</div>
  <div><label>Needed by</label><input type="date" ${at("due")} value="${esc(o.due)}"></div><div><label>Time (optional)</label><input type="time" ${at("tm")} value="${esc(o.tm)}"></div>

  <div class="row" style="margin:10px 0 0">${NXT[o.st]?`<button class="btn s" data-a="ns:${id}">${NXT[o.st][1]}</button>`:""}<span>${o.st?qTag(b):""} ${o.st?prTag(o.pr):""}</span><span class="mu">${o.due?"Due: ":""}${o.due?dueTxt(b):""}</span></div></div>`}
function delGroups(){const g={};S.bills.filter(isAct).forEach(b=>{const o=QD(b);if(o.dm=="none")return;const k=o.dm+"|"+o.loc.trim().toLowerCase();(g[k]=g[k]||{dm:o.dm,loc:o.loc.trim(),L:[]}).L.push(b)});

function weekCard(){const act=S.bills.filter(isAct),days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()+i*864e5).toISOString().slice(0,10);return{d,n:act.filter(b=>QD(b).due==d).length}}),mx=Math.max(1,...days.map(x=>x.n));
  return`<div class="card"><h2>Deadlines · next 7 days</h2>${days.map((x,i)=>`<div class="bl"><span>${i==0?"Today":i==1?"Tomorrow":new Date(x.d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",timeZone:"UTC"})}</span><div class="bar" style="width:${x.n/mx*100}%;${x.n?"":"opacity:.15"}"></div><span class="n">${x.n}</span></div>`).join("")}</div>`}
function upNext(){const L=qSort(S.bills.filter(isAct)),od=L.filter(b=>{const o=QD(b);return o.due&&o.due<today()}).length;

function queueView(){const all=S.bills.filter(b=>b[14]!="quote"),act=all.filter(isAct),eta=qEta(),td=today(),

  <div class="row"><input id="q" placeholder="Search jobs, accounts, places…" value="${esc(q)}">${op("st","",{active:"Active",queued:"Queued",printing:"Printing",ready:"Ready",delivered:"Delivered",all:"All queued jobs"})}${op("pr","",PRI,"All priorities")}${op("dm","",DLM,"Any delivery")}${op("so","",{priority:"Sort: priority",due:"Sort: due date",manual:"Sort: manual order"})}
  <button class="btn s" data-a="qn">Start next job</button><button class="btn g s" data-a="cq">Copy queue</button></div>
  <div class="card" style="margin-bottom:14px">${r.length?tbl(["#","Priority","Job","Account","Needed by","Delivery","Pay","Status",""],r.map((b,i)=>{const o=QD(b),e=eta[b[0]];return{a:"b:"+b[0],c:[i+1,prTag(o.pr),`${esc(b[1])} <span class="mono mu" style="font-size:12px">${b[0]}</span>${o.note?`<div class="mu" style="font-size:12px">${esc(o.note)}</div>`:""}`,esc(b[3]||"–"),dueTxt(b)+(e&&e.risk?` <span class="wn" title="Estimated finish ${e.eta} at ${CF().pd} printer h/day">⚠ ETA ${e.eta}</span>`:""),whereTxt(b),b[6]?'<span class="ok">Paid</span>':`<span class="wn">${E(b[5])}</span>`,qTag(b),
